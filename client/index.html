<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Discover and plan your perfect one-day visit to places within 25 km of Deurumpitiya, Sri Lanka.">
  <title>Home — OneDayGo</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗺️</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 font-sans text-gray-800 flex flex-col min-h-screen">

  <!-- Navbar -->
  <nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center">
          <a href="index.html" class="flex-shrink-0 flex items-center">
            <span class="text-2xl font-bold text-green-700">OneDayGo</span>
          </a>
          <div class="hidden md:flex ml-6 space-x-8">
            <a href="index.html"
              class="border-green-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Home</a>
            <a href="map.html"
              class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Map</a>
            <a href="itinerary.html"
              class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Itinerary</a>
          </div>
        </div>
        <div class="flex items-center space-x-4">
          <div class="hidden md:flex items-center" id="authSection">
            <!-- Populated by auth.js -->
          </div>
          <!-- Mobile menu button -->
          <div class="flex items-center md:hidden">
            <button onclick="document.getElementById('mobileNav').classList.toggle('hidden')" class="text-gray-500 hover:text-gray-700 focus:outline-none">
              <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- Mobile menu -->
    <div id="mobileNav" class="hidden md:hidden bg-white border-t border-gray-200 px-2 pt-2 pb-3 space-y-1">
      <a href="index.html" class="block px-3 py-2 rounded-md text-base font-medium text-green-700 bg-green-50">Home</a>
      <a href="map.html" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-50">Map</a>
      <a href="itinerary.html" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-50">Itinerary</a>
      <div id="authSectionMobile" class="pt-4 pb-2 border-t border-gray-200 mt-2"></div>
    </div>
  </nav>

  <!-- Hero Section -->
  <div class="bg-green-700 text-white py-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
      <h1 class="text-4xl font-extrabold sm:text-5xl sm:tracking-tight lg:text-6xl">Plan Your Perfect Day</h1>
      <p class="mt-5 max-w-xl mx-auto text-xl text-green-100">Discover amazing places within 25 km of Deurumpitiya and
        build your custom itinerary.</p>
    </div>
  </div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">

    <!-- Filter Bar -->
    <div
      class="mb-8 space-y-4 md:space-y-0 md:flex md:justify-between md:items-center bg-white p-4 rounded-lg shadow-sm border border-gray-100">

      <div>
        <span
          class="text-sm font-semibold text-gray-500 uppercase tracking-wider mr-2 block mb-2 md:inline md:mb-0">Category</span>
        <div class="inline-flex flex-wrap gap-2">
          <button onclick="setCategory('')" data-value=""
            class="category-filter bg-green-600 text-white px-3 py-1 rounded-full text-sm font-medium transition">All</button>
          <button onclick="setCategory('Religious')" data-value="Religious"
            class="category-filter bg-gray-200 text-gray-700 px-3 py-1 rounded-full text-sm font-medium hover:bg-gray-300 transition">Religious</button>
          <button onclick="setCategory('Nature')" data-value="Nature"
            class="category-filter bg-gray-200 text-gray-700 px-3 py-1 rounded-full text-sm font-medium hover:bg-gray-300 transition">Nature</button>
          <button onclick="setCategory('Heritage')" data-value="Heritage"
            class="category-filter bg-gray-200 text-gray-700 px-3 py-1 rounded-full text-sm font-medium hover:bg-gray-300 transition">Heritage</button>
          <button onclick="setCategory('Leisure')" data-value="Leisure"
            class="category-filter bg-gray-200 text-gray-700 px-3 py-1 rounded-full text-sm font-medium hover:bg-gray-300 transition">Leisure</button>
        </div>
      </div>

      <div>
        <span
          class="text-sm font-semibold text-gray-500 uppercase tracking-wider mr-2 block mb-2 md:inline md:mb-0">Distance</span>
        <div class="inline-flex flex-wrap gap-2">
          <button onclick="setDistance('')" data-value=""
            class="distance-filter bg-green-600 text-white px-3 py-1 rounded-full text-sm font-medium transition">All</button>
          <button onclick="setDistance('10')" data-value="10"
            class="distance-filter bg-gray-200 text-gray-700 px-3 py-1 rounded-full text-sm font-medium hover:bg-gray-300 transition">Within
            10km</button>
          <button onclick="setDistance('15')" data-value="15"
            class="distance-filter bg-gray-200 text-gray-700 px-3 py-1 rounded-full text-sm font-medium hover:bg-gray-300 transition">Within
            15km</button>
          <button onclick="setDistance('25')" data-value="25"
            class="distance-filter bg-gray-200 text-gray-700 px-3 py-1 rounded-full text-sm font-medium hover:bg-gray-300 transition">Within
            25km</button>
        </div>
      </div>

    </div>

    <!-- POI Grid -->
    <div id="placesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Loading spinner shown by default -->
      <div id="loadingSpinner" class="col-span-full flex justify-center items-center py-16">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-green-600 border-t-transparent"></div>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 mt-auto py-8">
    <div class="max-w-7xl mx-auto px-4 text-center text-gray-500">
      &copy; 2026 OneDayGo. All rights reserved.
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/places.js"></script>
</body>

</html>
