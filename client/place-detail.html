<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View full details, photos, travel tips, and opening hours for this destination on OneDayGo.">
  <title>Place Details — OneDayGo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗺️</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 flex flex-col min-h-screen">

  <!-- Navbar -->
  <nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center">
          <a href="index.html" class="flex-shrink-0 flex items-center">
            <span class="text-2xl font-bold text-green-700">OneDayGo</span>
          </a>
          <div class="hidden md:flex ml-6 space-x-8">
            <a href="index.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Home</a>
            <a href="map.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Map</a>
            <a href="itinerary.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Itinerary</a>
          </div>
        </div>
        <div class="flex items-center space-x-4">
          <div class="hidden md:flex items-center" id="authSection">
            <!-- Populated by auth.js -->
          </div>
          <!-- Mobile menu button -->
          <div class="flex items-center md:hidden">
            <button onclick="document.getElementById('mobileNav').classList.toggle('hidden')" class="text-gray-500 hover:text-gray-700 focus:outline-none">
              <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- Mobile menu -->
    <div id="mobileNav" class="hidden md:hidden bg-white border-t border-gray-200 px-2 pt-2 pb-3 space-y-1">
      <a href="index.html" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-50">Home</a>
      <a href="map.html" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-50">Map</a>
      <a href="itinerary.html" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-50">Itinerary</a>
      <div id="authSectionMobile" class="pt-4 pb-2 border-t border-gray-200 mt-2"></div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full" id="contentArea">
    
    <a href="index.html" class="inline-flex items-center text-green-600 hover:text-green-700 mb-6 font-medium">
      &larr; Back to places
    </a>

    <!-- Header -->
    <div class="mb-6">
      <h1 id="placeName" class="text-4xl font-bold text-gray-900 mb-3">Loading...</h1>
      <div class="flex flex-wrap items-center gap-3">
        <span id="categoryBadge" class="px-3 py-1 rounded-full text-sm font-medium bg-gray-200">...</span>
        <span id="distanceBadge" class="bg-blue-50 text-blue-700 px-3 py-1 rounded-full text-sm font-medium">...</span>
      </div>
    </div>

    <!-- Gallery -->
    <div id="photoGallery" class="flex overflow-x-auto space-x-4 mb-8 pb-4">
      <!-- Images added here -->
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Left Col -->
      <div class="lg:col-span-2 space-y-8">
        <section>
          <h2 class="text-2xl font-semibold mb-3 border-b pb-2">Description</h2>
          <p id="description" class="text-gray-700 leading-relaxed"></p>
        </section>

        <section>
          <h2 class="text-2xl font-semibold mb-3 border-b pb-2">Travel Tips</h2>
          <ul id="travelTips" class="list-disc pl-5 text-gray-700 space-y-1"></ul>
        </section>

        <section id="safetySection" class="hidden">
          <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded">
            <h2 class="text-lg font-semibold text-red-800 mb-2">Safety Warnings</h2>
            <ul id="safetyWarnings" class="list-disc pl-5 text-red-700 space-y-1"></ul>
          </div>
        </section>
      </div>

      <!-- Right Col -->
      <div class="lg:col-span-1 space-y-6">
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
          <h3 class="text-lg font-semibold mb-4 border-b pb-2">Quick Info</h3>
          
          <div class="mb-4">
            <p class="text-sm text-gray-500 font-medium">Opening Hours</p>
            <p id="openingHours" class="text-gray-900"></p>
          </div>
          
          <div class="mb-4">
            <p class="text-sm text-gray-500 font-medium">Entrance Fee</p>
            <p id="feeLKR" class="text-gray-900 font-medium"></p>
            <p id="feeUSD" class="text-gray-500 text-sm hidden"></p>
          </div>
          
          <div class="mb-4">
            <p class="text-sm text-gray-500 font-medium">Best Visit Time</p>
            <p id="bestVisitTime" class="text-gray-900"></p>
          </div>
          
          <div class="mb-6">
            <p class="text-sm text-gray-500 font-medium">Last Updated</p>
            <p id="lastUpdated" class="text-gray-900"></p>
          </div>

          <button onclick="handleAddToItinerary()" aria-label="Add this place to your itinerary" class="w-full bg-green-600 text-white font-medium py-3 rounded hover:bg-green-700 transition shadow-sm">
            Add to Itinerary
          </button>
          <div id="actionMsg" class="hidden mt-4 p-3 rounded text-center text-sm font-medium"></div>
        </div>
      </div>

    </div>

  </main>

  <footer class="bg-white border-t border-gray-200 mt-auto py-8">
    <div class="max-w-7xl mx-auto px-4 text-center text-gray-500">
      &copy; 2026 OneDayGo. All rights reserved.
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/place-detail.js"></script>
</body>
</html>
