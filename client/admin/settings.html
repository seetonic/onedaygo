<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - OneDayGo Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 flex h-screen overflow-hidden relative">

  <!-- Sidebar -->
  <aside class="w-64 bg-green-800 text-white flex flex-col hidden md:flex z-10">
    <div class="h-16 flex items-center px-6 border-b border-green-700">
      <span class="text-xl font-bold">OneDayGo Admin</span>
    </div>
    <nav class="flex-grow py-4">
      <a href="dashboard.html" class="block px-6 py-3 hover:bg-green-700 border-l-4 border-transparent transition">Dashboard</a>
      <a href="manage-places.html" class="block px-6 py-3 hover:bg-green-700 border-l-4 border-transparent transition">Manage Places</a>
      <a href="settings.html" class="block px-6 py-3 bg-green-900 border-l-4 border-green-400">Settings</a>
    </nav>
    <div class="p-4 border-t border-green-700">
      <button onclick="handleAdminLogout()" class="w-full text-left px-2 py-2 hover:bg-green-700 rounded transition">Logout</button>
    </div>
  </aside>

  <!-- Mobile Header -->
  <div class="md:hidden bg-green-800 text-white w-full fixed top-0 h-16 flex items-center justify-between px-4 z-20">
    <span class="text-xl font-bold">OneDayGo Admin</span>
    <button onclick="document.getElementById('mobileMenu').classList.toggle('hidden')">Menu</button>
  </div>
  <div id="mobileMenu" class="hidden md:hidden fixed top-16 w-full bg-green-800 text-white z-20 border-t border-green-700">
    <a href="dashboard.html" class="block px-4 py-3 hover:bg-green-700">Dashboard</a>
    <a href="manage-places.html" class="block px-4 py-3 hover:bg-green-700">Manage Places</a>
    <a href="settings.html" class="block px-4 py-3 bg-green-900">Settings</a>
    <button onclick="handleAdminLogout()" class="block w-full text-left px-4 py-3 hover:bg-green-700">Logout</button>
  </div>

  <!-- Main Content -->
  <main class="flex-grow overflow-y-auto p-4 md:p-8 mt-16 md:mt-0 z-0 relative">
    <div class="max-w-4xl mx-auto">
      
      <h1 class="text-2xl font-bold text-gray-900 mb-6">Settings</h1>
      
      <!-- Settings Card -->
      <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-6 max-w-lg">
        <h2 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">Exchange Rate</h2>
        
        <div class="mb-4 text-sm text-gray-500">
          Current Rate: <span id="currentRateDisplay" class="font-bold text-gray-900">Loading...</span>
        </div>

        <form id="settingsForm" onsubmit="handleSaveSettings(event)">
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">New USD per 1 LKR</label>
            <input type="number" step="0.000001" id="exchangeRate" required class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-green-500 outline-none" placeholder="e.g. 0.0033">
          </div>
          
          <button type="submit" id="saveBtn" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition font-medium">Save Settings</button>
        </form>

        <div id="successMsg" class="hidden mt-4 p-3 bg-green-100 text-green-700 rounded text-sm"></div>
        <div id="errorMsg" class="hidden mt-4 p-3 bg-red-100 text-red-700 rounded text-sm"></div>
      </div>

      <!-- Starting Point Card -->
      <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-6 max-w-lg mt-8">
        <h2 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">Starting Point</h2>
        
        <form id="startingPointForm" onsubmit="handleSaveStartingPoint(event)">
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
            <input type="text" id="spName" required class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-green-500 outline-none" placeholder="e.g. Deurumpitiya">
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Latitude</label>
            <input type="number" step="0.0001" id="spLat" required class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-green-500 outline-none" placeholder="e.g. 6.8476">
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Longitude</label>
            <input type="number" step="0.0001" id="spLng" required class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-green-500 outline-none" placeholder="e.g. 80.3647">
          </div>
          
          <button type="submit" id="spSaveBtn" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition font-medium">Save Starting Point</button>
        </form>

        <div id="spSuccessMsg" class="hidden mt-4 p-3 bg-green-100 text-green-700 rounded text-sm"></div>
        <div id="spErrorMsg" class="hidden mt-4 p-3 bg-red-100 text-red-700 rounded text-sm"></div>
      </div>

    </div>
  </main>

  <script src="../js/admin/settings.js"></script>
</body>
</html>
