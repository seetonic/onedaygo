<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - OneDayGo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-64 bg-green-800 text-white flex flex-col hidden md:flex">
    <div class="h-16 flex items-center px-6 border-b border-green-700">
      <span class="text-xl font-bold">OneDayGo Admin</span>
    </div>
    <nav class="flex-grow py-4">
      <a href="dashboard.html" class="block px-6 py-3 bg-green-900 border-l-4 border-green-400">Dashboard</a>
      <a href="manage-places.html" class="block px-6 py-3 hover:bg-green-700 border-l-4 border-transparent transition">Manage Places</a>
      <a href="settings.html" class="block px-6 py-3 hover:bg-green-700 border-l-4 border-transparent transition">Settings</a>
    </nav>
    <div class="p-4 border-t border-green-700">
      <button onclick="handleAdminLogout()" class="w-full text-left px-2 py-2 hover:bg-green-700 rounded transition">Logout</button>
    </div>
  </aside>

  <!-- Mobile Header -->
  <div class="md:hidden bg-green-800 text-white w-full fixed top-0 h-16 flex items-center justify-between px-4 z-50">
    <span class="text-xl font-bold">OneDayGo Admin</span>
    <button onclick="document.getElementById('mobileMenu').classList.toggle('hidden')">Menu</button>
  </div>
  <div id="mobileMenu" class="hidden md:hidden fixed top-16 w-full bg-green-800 text-white z-40 border-t border-green-700">
    <a href="dashboard.html" class="block px-4 py-3 bg-green-900">Dashboard</a>
    <a href="manage-places.html" class="block px-4 py-3 hover:bg-green-700">Manage Places</a>
    <a href="settings.html" class="block px-4 py-3 hover:bg-green-700">Settings</a>
    <button onclick="handleAdminLogout()" class="block w-full text-left px-4 py-3 hover:bg-green-700">Logout</button>
  </div>

  <!-- Main Content -->
  <main class="flex-grow overflow-y-auto p-4 md:p-8 mt-16 md:mt-0">
    <div class="max-w-6xl mx-auto">
      <h1 class="text-2xl font-bold text-gray-900 mb-6">Dashboard</h1>
      
      <!-- Stats Row -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
          <h3 class="text-gray-500 text-sm font-medium mb-1">Total Places</h3>
          <p id="statTotalPlaces" class="text-3xl font-bold text-gray-900">...</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
          <h3 class="text-gray-500 text-sm font-medium mb-1">Published Places</h3>
          <p id="statPublishedPlaces" class="text-3xl font-bold text-green-600">...</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
          <h3 class="text-gray-500 text-sm font-medium mb-1">Exchange Rate</h3>
          <p id="statExchangeRate" class="text-xl font-bold text-gray-900 mt-2">...</p>
        </div>
      </div>

      <!-- Recent Places -->
      <div class="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-100">
          <h3 class="text-lg font-medium text-gray-900">Recently Updated Places</h3>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <thead class="bg-gray-50 text-gray-500 text-sm">
              <tr>
                <th class="px-6 py-3 font-medium">Name</th>
                <th class="px-6 py-3 font-medium">Category</th>
                <th class="px-6 py-3 font-medium">Distance</th>
                <th class="px-6 py-3 font-medium">Published</th>
                <th class="px-6 py-3 font-medium">Last Updated</th>
              </tr>
            </thead>
            <tbody id="recentPlacesTable" class="divide-y divide-gray-100">
              <tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script src="../js/admin/dashboard.js"></script>
</body>
</html>
