<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Places - OneDayGo Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 flex h-screen overflow-hidden relative">

  <!-- Sidebar -->
  <aside class="w-64 bg-green-800 text-white flex flex-col hidden md:flex z-10">
    <div class="h-16 flex items-center px-6 border-b border-green-700">
      <span class="text-xl font-bold">OneDayGo Admin</span>
    </div>
    <nav class="flex-grow py-4">
      <a href="dashboard.html" class="block px-6 py-3 hover:bg-green-700 border-l-4 border-transparent transition">Dashboard</a>
      <a href="manage-places.html" class="block px-6 py-3 bg-green-900 border-l-4 border-green-400">Manage Places</a>
      <a href="settings.html" class="block px-6 py-3 hover:bg-green-700 border-l-4 border-transparent transition">Settings</a>
    </nav>
    <div class="p-4 border-t border-green-700">
      <button onclick="handleAdminLogout()" class="w-full text-left px-2 py-2 hover:bg-green-700 rounded transition">Logout</button>
    </div>
  </aside>

  <!-- Mobile Header -->
  <div class="md:hidden bg-green-800 text-white w-full fixed top-0 h-16 flex items-center justify-between px-4 z-20">
    <span class="text-xl font-bold">OneDayGo Admin</span>
    <button onclick="document.getElementById('mobileMenu').classList.toggle('hidden')">Menu</button>
  </div>
  <div id="mobileMenu" class="hidden md:hidden fixed top-16 w-full bg-green-800 text-white z-20 border-t border-green-700">
    <a href="dashboard.html" class="block px-4 py-3 hover:bg-green-700">Dashboard</a>
    <a href="manage-places.html" class="block px-4 py-3 bg-green-900">Manage Places</a>
    <a href="settings.html" class="block px-4 py-3 hover:bg-green-700">Settings</a>
    <button onclick="handleAdminLogout()" class="block w-full text-left px-4 py-3 hover:bg-green-700">Logout</button>
  </div>

  <!-- Main Content -->
  <main class="flex-grow overflow-y-auto p-4 md:p-8 mt-16 md:mt-0 z-0 relative">
    <div class="max-w-6xl mx-auto">
      
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Manage Places</h1>
        <button onclick="openModal()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition shadow-sm font-medium">Add New Place</button>
      </div>
      
      <!-- Places Table -->
      <div class="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <thead class="bg-gray-50 text-gray-500 text-sm">
              <tr>
                <th class="px-6 py-3 font-medium">Photo</th>
                <th class="px-6 py-3 font-medium">Name</th>
                <th class="px-6 py-3 font-medium">Category</th>
                <th class="px-6 py-3 font-medium">Distance</th>
                <th class="px-6 py-3 font-medium">Published</th>
                <th class="px-6 py-3 font-medium text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="placesTableBody" class="divide-y divide-gray-100">
              <tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Add/Edit Modal Overlay -->
  <div id="placeModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-center items-center overflow-y-auto pt-10 pb-10">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-3xl p-6 m-4 relative max-h-full overflow-y-auto">
      
      <h2 id="modalTitle" class="text-2xl font-bold text-gray-900 mb-6">Add New Place</h2>
      
      <form id="placeForm" onsubmit="handleSavePlace(event)" class="space-y-4">
        <input type="hidden" id="placeId">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
            <input type="text" id="name" required class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-green-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
            <select id="category" required class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-green-500 outline-none">
              <option value="Religious">Religious</option>
              <option value="Nature">Nature</option>
              <option value="Heritage">Heritage</option>
              <option value="Leisure">Leisure</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
          <textarea id="description" required rows="3" class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-green-500 outline-none"></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Latitude</label>
            <input type="number" step="any" id="lat" required class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-green-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Longitude</label>
            <input type="number" step="any" id="lng" required class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-green-500 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Distance From Base (km)</label>
            <input type="number" step="any" id="distanceFromBase" required class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-green-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Best Visit Time</label>
            <input type="text" id="bestVisitTime" class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-green-500 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Opening Hours</label>
            <input type="text" id="openingHours" class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-green-500 outline-none" placeholder="e.g. 6:00 AM - 6:00 PM">
          </div>
          <div class="flex items-center mt-6">
            <input type="checkbox" id="isPublished" class="h-4 w-4 text-green-600 focus:ring-green-500 border-gray-300 rounded">
            <label class="ml-2 block text-sm text-gray-900 font-medium">Published (Visible to public)</label>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Entrance Fee (LKR)</label>
            <input type="number" id="feeLkr" class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-green-500 outline-none" placeholder="0">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Entrance Fee Note</label>
            <input type="text" id="feeNote" class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-green-500 outline-none" placeholder="e.g. LKR 3000 for foreigners">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Travel Tips (One tip per line)</label>
          <textarea id="travelTips" rows="3" class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-green-500 outline-none" placeholder="Wear comfortable shoes..."></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Safety Warnings (One warning per line)</label>
          <textarea id="safetyWarnings" rows="2" class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-green-500 outline-none" placeholder="Beware of monkeys..."></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Photo Upload</label>
          <input type="file" id="photoUpload" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100">
        </div>

        <div class="flex justify-end space-x-3 pt-4 border-t mt-6">
          <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded text-gray-600 hover:bg-gray-50 transition">Cancel</button>
          <button type="submit" id="saveBtn" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition font-medium">Save Place</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed top-4 right-4 bg-green-500 text-white px-4 py-3 rounded shadow-lg z-50 flex items-center transition-opacity">
    <span id="toastMsg" class="font-medium"></span>
  </div>

  <script src="../js/admin/manage-places.js"></script>
</body>
</html>
