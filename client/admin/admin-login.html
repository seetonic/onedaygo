<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - OneDayGo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold text-green-800">Admin Login</h1>
      <p class="text-gray-500 mt-2">OneDayGo Control Panel</p>
    </div>

    <!-- Error Message -->
    <div id="errorMsg" class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded text-sm text-center"></div>

    <!-- Login Form -->
    <form id="adminLoginForm" onsubmit="handleAdminLogin(event)" class="space-y-4">
      <div>
        <label class="block text-gray-700 mb-1">Email</label>
        <input type="email" id="loginEmail" required class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-600">
      </div>
      <div>
        <label class="block text-gray-700 mb-1">Password</label>
        <input type="password" id="loginPassword" required class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-600">
      </div>
      <button type="submit" class="w-full bg-green-800 text-white py-2 rounded hover:bg-green-900 transition">Login</button>
    </form>

    <div class="mt-6 text-center text-sm">
      <a href="../index.html" class="text-green-700 hover:underline">&larr; Back to main site</a>
    </div>
  </div>

  <script src="../js/admin/admin-login.js"></script>
</body>
</html>
