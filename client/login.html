<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login or register to plan your one-day trip with OneDayGo.">
  <title>Login — OneDayGo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗺️</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold text-green-700">OneDayGo</h1>
      <p class="text-gray-500 mt-2">Local Tourist Day Visit Planner</p>
    </div>

    <!-- Tabs -->
    <div class="flex border-b mb-6">
      <button id="loginTab" onclick="switchTab('login')"
        class="w-1/2 py-2 text-center border-b-2 font-medium text-green-600 border-green-600 transition-colors">
        Login
      </button>
      <button id="registerTab" onclick="switchTab('register')"
        class="w-1/2 py-2 text-center border-b-2 font-medium text-gray-500 border-transparent transition-colors">
        Register
      </button>
    </div>

    <!-- Error Message -->
    <div id="errorMsg" class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded text-sm text-center"></div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label for="loginEmail" class="block text-gray-700 mb-1">Email</label>
        <input type="email" id="loginEmail" required
          class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-500">
      </div>
      <div>
        <label for="loginPassword" class="block text-gray-700 mb-1">Password</label>
        <input type="password" id="loginPassword" required
          class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-500">
      </div>
      <button type="submit"
        class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 transition">Login</button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" onsubmit="handleRegister(event)" class="hidden space-y-4">
      <div>
        <label for="registerName" class="block text-gray-700 mb-1">Name</label>
        <input type="text" id="registerName" required
          class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-500">
      </div>
      <div>
        <label for="registerEmail" class="block text-gray-700 mb-1">Email</label>
        <input type="email" id="registerEmail" required
          class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-500">
      </div>
      <div>
        <label for="registerPassword" class="block text-gray-700 mb-1">Password</label>
        <input type="password" id="registerPassword" required
          class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-500">
      </div>
      <button type="submit"
        class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 transition">Register</button>
    </form>

    <div class="mt-6 text-center text-sm text-gray-500">
      Are you an admin? <a href="/admin/admin-login.html" class="text-green-600 hover:underline">Admin Login</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>

</html>
