<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Build and save your custom one-day itinerary for places around Deurumpitiya with OneDayGo.">
  <title>My Itinerary — OneDayGo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗺️</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 flex flex-col min-h-screen">

  <!-- Navbar -->
  <nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center">
          <a href="index.html" class="flex-shrink-0 flex items-center">
            <span class="text-2xl font-bold text-green-700">OneDayGo</span>
          </a>
          <div class="hidden md:flex ml-6 space-x-8">
            <a href="index.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Home</a>
            <a href="map.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Map</a>
            <a href="itinerary.html" class="border-green-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Itinerary</a>
          </div>
        </div>
        <div class="flex items-center space-x-4">
          <div class="hidden md:flex items-center" id="authSection">
            <!-- Populated by auth.js -->
          </div>
          <!-- Mobile menu button -->
          <div class="flex items-center md:hidden">
            <button onclick="document.getElementById('mobileNav').classList.toggle('hidden')" class="text-gray-500 hover:text-gray-700 focus:outline-none">
              <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- Mobile menu -->
    <div id="mobileNav" class="hidden md:hidden bg-white border-t border-gray-200 px-2 pt-2 pb-3 space-y-1">
      <a href="index.html" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-50">Home</a>
      <a href="map.html" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-50">Map</a>
      <a href="itinerary.html" class="block px-3 py-2 rounded-md text-base font-medium text-green-700 bg-green-50">Itinerary</a>
      <div id="authSectionMobile" class="pt-4 pb-2 border-t border-gray-200 mt-2"></div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full" id="mainContent">
    
    <h1 class="text-3xl font-bold text-gray-900 mb-8">My One-Day Plan</h1>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      
      <!-- Draft Plan -->
      <div>
        <div class="flex justify-between items-end mb-4">
          <div>
            <h2 class="text-xl font-semibold text-gray-800">Draft Plan</h2>
            <p class="text-sm text-gray-500">Drag and drop to reorder your stops.</p>
          </div>
          <span class="text-xs bg-gray-200 text-gray-600 px-2 py-1 rounded font-medium">Max 6 places</span>
        </div>
        
        <ul id="draftList" class="min-h-[150px] bg-gray-50 rounded border-2 border-dashed border-gray-200 p-2 mb-4">
          <!-- Populated by JS -->
        </ul>
        
        <button id="saveDraftBtn" onclick="handleSave()" class="w-full bg-green-600 text-white font-medium py-3 rounded hover:bg-green-700 transition shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
          Save & Calculate Travel Times
        </button>
      </div>

      <!-- Saved Plan -->
      <div>
        <h2 class="text-xl font-semibold text-gray-800 mb-4">Saved Plan</h2>
        <div id="savedPlanContainer">
          <!-- Populated by JS -->
        </div>
      </div>

    </div>

  </main>

  <footer class="bg-white border-t border-gray-200 mt-auto py-8">
    <div class="max-w-7xl mx-auto px-4 text-center text-gray-500">
      &copy; 2026 OneDayGo. All rights reserved.
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/itinerary.js"></script>
</body>
</html>
